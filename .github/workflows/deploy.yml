name: Export and publish

# Push to main -> this exports the Godot web build and publishes it to the
# `deploy` branch. Vercel is connected to that branch and redeploys on its own.
#
# The export runs here rather than on Vercel because Vercel's build container
# cannot run the Godot binary (it links X11 even under --headless) and the
# export templates are a 1.3GB download. Nobody needs Godot installed to deploy.
#
# `main` stays source-only: the build never lands in its history. The `deploy`
# branch is replaced wholesale on every run — a single orphan commit — so it
# does not accumulate 40MB of engine per export either.
#
# There are NO secrets to configure here. The Supabase credentials live in the
# Vercel project's environment variables and are written into the site by
# tools/write-config.mjs during Vercel's build. See DEPLOY.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable
  SITE: https://rowdy-robo.vercel.app

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The binary links X11 even with --headless, so these are needed on a
      # bare runner regardless of the display server Godot ends up using.
      - name: Install Godot runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1

      # Keyed on the Godot version, so a version bump invalidates it and
      # nothing else does. The templates are the slow part (1.3GB).
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"

          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # Godot looks for templates under a version-named directory, and the
          # .tpz unpacks to a folder called "templates" that has to be renamed.
          mkdir -p ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-out
          mv /tmp/templates-out/templates \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Verify the web templates are present
        run: |
          set -euo pipefail
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # The preset builds with thread support off, so these are the two the
          # exporter will ask for. Failing here beats a confusing export error.
          for t in web_nothreads_release.zip web_nothreads_debug.zip; do
            test -f "$dir/$t" || { echo "Missing template: $dir/$t"; exit 1; }
          done
          ~/godot-bin/godot --version

      - name: Export the web build
        run: |
          set -euo pipefail
          mkdir -p web

          # Exported with EMPTY credentials on purpose. Whatever config.json
          # holds at export time gets baked into index.pck, and the .pck is
          # published to a public branch. The real values are written next to
          # index.html by Vercel's build step, and that copy is the one the web
          # build fetches at startup.
          printf '{\n  "supabase_url": "",\n  "supabase_anon_key": ""\n}\n' > config.json

          # A first pass to build the import cache. Without it the exporter
          # trips over unresolved UIDs on a clean checkout.
          ~/godot-bin/godot --headless --path . --import || true
          ~/godot-bin/godot --headless --path . --export-release Web web/index.html

      - name: Check the export produced something
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            test -s "web/$f" || { echo "Missing or empty: web/$f"; exit 1; }
          done
          # Belt and braces: the published .pck must not carry real credentials.
          # Matched narrowly on purpose — config.example.json ships a
          # YOUR-PROJECT-REF.supabase.co placeholder, and an earlier version of
          # this check failed the build on that.
          leaked=$(grep -oaE 'https://[a-z0-9]{10,}\.supabase\.co|sb_publishable_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{30,}' web/index.pck | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "index.pck carries real credentials — it was exported with a populated config.json:"
            echo "$leaked"
            exit 1
          fi
          ls -lh web

      - name: Assemble the deploy tree
        run: |
          set -euo pipefail
          rm -rf deploy-tree
          mkdir -p deploy-tree/build
          cp -r web/. deploy-tree/build/

          # What Vercel reads: vercel.json points at build/ and runs the config
          # writer before serving it.
          cp tools/vercel-deploy.json deploy-tree/vercel.json
          cp tools/write-config.mjs   deploy-tree/write-config.mjs

          # Lets the verification below tell "the new build is live" apart from
          # "some older build is still being served".
          echo "${GITHUB_SHA}" > deploy-tree/build/version.txt

          find deploy-tree -maxdepth 2 -printf '%P\n' | sort

      - name: Publish to the deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd deploy-tree
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Build of ${GITHUB_SHA}"
          # Replaced wholesale each run, so the branch never accumulates builds.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Pushed build of ${GITHUB_SHA} to the deploy branch."

      - name: Wait for Vercel and verify the live site
        run: |
          set -euo pipefail

          echo "Waiting for ${SITE} to serve this commit..."
          live=""
          for attempt in $(seq 1 24); do
            live=$(curl -fsS "${SITE}/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            [ "$live" = "${GITHUB_SHA}" ] && break
            sleep 15
          done

          if [ "$live" != "${GITHUB_SHA}" ]; then
            echo "The live site is not serving this commit after 6 minutes."
            echo "  expected: ${GITHUB_SHA}"
            echo "  got:      ${live:-<nothing>}"
            echo
            echo "If this is the first run, Vercel is probably not connected to the"
            echo "deploy branch yet. See step 7 of DEPLOY.md. Otherwise check the"
            echo "Vercel deployment log — a missing SUPABASE_URL or SUPABASE_ANON_KEY"
            echo "environment variable fails the build on purpose."
            exit 1
          fi

          # A deploy can succeed while serving nothing, which is how this broke
          # the first time. Check the files the game actually needs.
          for path in "" index.wasm index.pck config.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}/${path}")
            echo "  /${path} -> ${code}"
            test "$code" = "200" || { echo "Live site is not serving /${path}"; exit 1; }
          done

          # And that the credentials were actually injected, rather than the
          # empty placeholder being served.
          if ! curl -fsS "${SITE}/config.json" | grep -q "supabase.co"; then
            echo "config.json is served but has no Supabase URL in it."
            echo "Check SUPABASE_URL / SUPABASE_ANON_KEY on the Vercel project."
            exit 1
          fi

          echo "Live and serving ${GITHUB_SHA}."
          {
            echo "### Deployed"
            echo "${SITE} is now serving \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
