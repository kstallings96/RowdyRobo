name: Export and deploy

# Push to main and the live site updates. The Godot export runs here rather
# than on Vercel, because Vercel's build container cannot run the Godot binary
# and the export templates are a 1.3GB download.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN        vercel.com/account/tokens
#   VERCEL_ORG_ID       from web/.vercel/project.json after `npx vercel link`
#   VERCEL_PROJECT_ID   same file
#   SUPABASE_URL        your project URL
#   SUPABASE_ANON_KEY   the publishable / anon key, never service_role
#
# The Supabase key lives here rather than in the repo so it is not committed,
# even though it is public by design once deployed. Row-level security is what
# protects the data — see supabase/schema.sql.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# A second push while one deploy is running cancels the older one, so the live
# site always ends up matching the newest commit rather than whichever build
# happened to finish last.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The binary links X11 even with --headless, so these are needed on a
      # bare runner regardless of the display server Godot ends up using.
      - name: Install Godot runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1

      # Keyed on the Godot version, so a version bump invalidates it and
      # nothing else does. The templates are the slow part (1.3GB).
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"

          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # Godot looks for templates under a version-named directory, and the
          # .tpz unpacks to a folder called "templates" that has to be renamed.
          mkdir -p ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/templates.tpz \
            "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-out
          mv /tmp/templates-out/templates \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Verify the web templates are present
        run: |
          set -euo pipefail
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # The preset builds with thread support off, so these are the two the
          # exporter will ask for. Failing here beats a confusing export error.
          for t in web_nothreads_release.zip web_nothreads_debug.zip; do
            test -f "$dir/$t" || { echo "Missing template: $dir/$t"; exit 1; }
          done
          ~/godot-bin/godot --version

      - name: Write config.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY are not set."
            echo "The build would deploy a game that silently records nothing."
            exit 1
          fi
          # Written before the export so the .pck carries it as a fallback; the
          # copy served next to index.html is what the web build actually reads.
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{supabase_url: $url, supabase_anon_key: $key}' > config.json

      - name: Export the web build
        run: |
          set -euo pipefail
          mkdir -p web
          # A first pass to build the import cache. Without it the exporter
          # trips over unresolved UIDs on a clean checkout.
          ~/godot-bin/godot --headless --path . --import || true
          ~/godot-bin/godot --headless --path . --export-release Web web/index.html
          cp tools/vercel.json web/vercel.json
          cp config.json web/config.json

      - name: Check the build actually produced something
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck config.json vercel.json; do
            test -s "web/$f" || { echo "Missing or empty: web/$f"; exit 1; }
          done
          ls -lh web

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Passed through the environment rather than interpolated into the
          # script, so the token never appears in a shell command line.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cd web
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -1)
          echo "Deployed: $url"
          {
            echo "### Deployed"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the deployment
        run: |
          set -euo pipefail
          # Catches the failure mode that started all this: a deploy that
          # succeeds but serves nothing.
          site="https://rowdy-robo.vercel.app"
          for path in "" config.json index.wasm index.pck; do
            code=000
            # The production alias can take a few seconds to point at the new
            # deployment, so a single early 404 is not yet a failure.
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$site/$path")
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "  /$path -> $code"
            test "$code" = "200" || { echo "Deployed site is not serving /$path"; exit 1; }
          done
